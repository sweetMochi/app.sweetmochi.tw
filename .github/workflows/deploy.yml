# 手動部署至 FTP 主機：GitHub → Actions → Deploy → Run workflow
name: Deploy

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: '僅列出將異動的檔案，不實際上傳'
        type: boolean
        default: false
      clean-slate:
        description: '先清空主機 /app.sweetmochi.tw/ 再完整上傳（移除不在 public 的舊檔）'
        type: boolean
        default: false

# 避免同時執行多個部署
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 正式主機為 PHP 7.0（Plesk alt-php70），語法不相容則中止部署
      # PHP 8.3 之前 php -l 一次只能檢查一個檔案，因此用 xargs -n1 逐一執行
      - name: PHP 7.0 語法檢查
        run: |
          docker run --rm -v "$PWD/public:/app" -w /app php:7.0-cli \
            sh -c 'find . -name "*.php" -print0 | xargs -0 -r -n1 php -l'

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # 測試失敗則中止部署
      - run: npx ng test --watch=false

      - run: npm run build

      - uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/app.sweetmochi.tw/browser/
          server-dir: /app.sweetmochi.tw/
          dry-run: ${{ inputs.dry-run }}
          dangerous-clean-slate: ${{ inputs.clean-slate }}
